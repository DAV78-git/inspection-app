<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inspection">
<meta name="theme-color" content="#dc2626">
<title>Audit Nuisibles — Rentokil</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f3f4f6;color:#111;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
input,textarea,select,button{font-family:inherit;font-size:14px;outline:none}
button{cursor:pointer}textarea{resize:vertical}img{display:block;max-width:100%}
.page{display:none;min-height:100dvh;flex-direction:column}.page.active{display:flex}
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}.pad{padding:16px}
.bar{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:40;flex-shrink:0}
.bar-title{flex:1;font-weight:600;font-size:16px}
.back-btn{background:none;border:none;font-size:20px;color:#6b7280;padding:0 4px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center}
.btn-r{background:#dc2626;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px}
.btn-g{background:#fff;border:1px solid #d1d5db;border-radius:10px;padding:10px 16px;font-size:14px;color:#374151}
.btn-green{background:#16a34a;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px}
.inp{width:100%;border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font-size:14px;background:#fff;color:#111;margin-top:4px}
.lbl{font-size:13px;font-weight:500;color:#374151;display:block;margin-bottom:2px;margin-top:12px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px 16px;margin-bottom:8px}
.chip{padding:6px 12px;border-radius:20px;border:1px solid #d1d5db;background:#f9fafb;color:#374151;font-size:13px;cursor:pointer;display:inline-block;margin:3px}
.chip.active{font-weight:600}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:flex-end}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;padding:20px;max-height:85dvh;overflow-y:auto}
.marker{position:absolute;width:28px;height:28px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;cursor:pointer;transform:translate(-50%,-50%);z-index:10}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.photo-slot{aspect-ratio:1;border:2px dashed #d1d5db;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;background:#f9fafb;font-size:24px;color:#9ca3af}
.photo-slot img{width:100%;height:100%;object-fit:cover}
.reco-row{padding:9px 12px;border-radius:8px;border:1px solid #e5e7eb;background:#f9fafb;font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:6px;text-align:left;width:100%;color:#111}
.reco-row.on{background:#f0fdf4;border-color:#16a34a}
.reco-check{font-size:16px;font-weight:bold;flex-shrink:0}
.prio-row{padding:9px 12px;border-radius:8px;border:1px solid #e5e7eb;background:#f9fafb;font-size:13px;cursor:pointer;margin-bottom:6px;text-align:left;width:100%;color:#111}
.cover-bar{background:#dc2626;padding:24px 16px 32px}
.cover-title{font-size:22px;font-weight:700;color:#fff}
.cover-sub{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:4px}
.insp-header{background:#dc2626;padding:12px 16px;flex-shrink:0}
.plans-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:10px}
.plan-tab{flex-shrink:0;font-size:11px;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid rgba(255,255,255,0.4);background:transparent;color:rgba(255,255,255,0.9);white-space:nowrap}
.plan-tab.sel{background:#fff;color:#dc2626;border-color:#fff}
.type-btn{background:#f9fafb;border-radius:12px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid}
.bot-bar{background:#fff;border-top:1px solid #e5e7eb;padding:10px 16px;display:flex;gap:10px;flex-shrink:0}
.tag{display:inline-flex;align-items:center;gap:4px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:20px;padding:4px 10px;font-size:13px;margin:3px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:200;display:none;white-space:nowrap}
</style>
</head>
<body>
<div id="toast"></div>

<!-- HOME -->
<div id="p-home" class="page">
  <div class="cover-bar">
    <div class="cover-sub">Rentokil · Audit terrain</div>
    <div class="cover-title">Inspections</div>
  </div>
  <div class="scroll pad" style="margin-top:-16px">
    <div id="home-active"></div>
    <div class="grid2" style="margin-bottom:10px">
      <button class="btn-r" style="border-radius:12px;padding:14px 8px;width:100%" onclick="nav('p-insp-new')">+ Inspection</button>
      <button class="btn-g" style="border-radius:12px;padding:14px 8px;width:100%" onclick="nav('p-clients')">👥 Clients</button>
    </div>
    <div class="grid2" style="margin-bottom:20px">
      <button class="btn-g" style="width:100%;padding:9px 8px;font-size:13px" onclick="doExport()">💾 Exporter</button>
      <button class="btn-g" style="width:100%;padding:9px 8px;font-size:13px" onclick="document.getElementById('imp-file').click()">📂 Importer</button>
    </div>
    <input id="imp-file" type="file" accept=".json" style="display:none" onchange="doImport(this)">
    <div id="home-history"></div>
  </div>
</div>

<!-- CLIENTS -->
<div id="p-clients" class="page">
  <div class="bar">
    <button class="back-btn" onclick="nav('p-home')">←</button>
    <span class="bar-title">Clients</span>
    <button class="btn-r" style="padding:6px 12px;font-size:13px" onclick="openClientForm(null)">+ Ajouter</button>
  </div>
  <div class="scroll pad" id="clients-list"></div>
</div>

<!-- CLIENT FORM -->
<div id="p-client-form" class="page">
  <div class="bar">
    <button class="back-btn" onclick="nav('p-clients')">←</button>
    <span class="bar-title" id="cform-title">Nouveau client</span>
    <button class="btn-r" style="padding:6px 12px;font-size:13px" onclick="saveClient()">Sauvegarder</button>
  </div>
  <div class="scroll pad">
    <input type="hidden" id="cform-id">
    <label class="lbl">Nom *</label><input class="inp" id="cform-name" placeholder="Ex: Panzani Marseille">
    <label class="lbl">Adresse</label><input class="inp" id="cform-address" placeholder="131 Av. Corot, 13013 Marseille">
    <label class="lbl">Contact</label><input class="inp" id="cform-contact" placeholder="Nom du responsable">
  </div>
</div>

<!-- CLIENT DETAIL -->
<div id="p-client-detail" class="page">
  <div class="bar">
    <button class="back-btn" onclick="nav('p-clients')">←</button>
    <span class="bar-title" id="cdetail-title"></span>
    <button class="btn-r" style="padding:6px 12px;font-size:13px" onclick="openPlanForm()">+ Plan</button>
  </div>
  <div class="scroll pad">
    <div id="cdetail-info"></div>
    <div style="font-weight:600;margin-bottom:10px">Plans</div>
    <div id="cdetail-plans"></div>
  </div>
</div>

<!-- PLAN FORM -->
<div id="p-plan-form" class="page">
  <div class="bar">
    <button class="back-btn" id="plan-back-btn" onclick="nav('p-client-detail')">←</button>
    <span class="bar-title">Ajouter un plan</span>
    <button class="btn-r" style="padding:6px 12px;font-size:13px" onclick="savePlan()">Sauvegarder</button>
  </div>
  <div class="scroll pad">
    <label class="lbl">Nom du plan *</label><input class="inp" id="pform-name" placeholder="Extérieur, RDC, Bât. trituration 3ème...">
    <label class="lbl">Bâtiment</label><input class="inp" id="pform-building" placeholder="Bâtiment trituration">
    <label class="lbl">Niveau / Étage</label><input class="inp" id="pform-floor" placeholder="RDC, 3ème étage...">
    <label class="lbl">Image du plan *</label>
    <input type="file" id="pform-file" accept="image/*" style="display:none" onchange="onPlanFile(this)">
    <div id="pform-preview" onclick="document.getElementById('pform-file').click()"
      style="border:2px dashed #d1d5db;border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px;background:#f9fafb;margin-top:4px;font-size:13px;color:#9ca3af">
      <div style="font-size:32px">📷</div>
      <div style="margin-top:6px">Photographier ou choisir un plan</div>
    </div>
    <input type="hidden" id="pform-image">
  </div>
</div>

<!-- NOUVELLE INSPECTION -->
<div id="p-insp-new" class="page">
  <div class="bar">
    <button class="back-btn" onclick="nav('p-home')">←</button>
    <span class="bar-title">Nouvelle inspection</span>
  </div>
  <div class="scroll pad">
    <label class="lbl">Client *</label>
    <select class="inp" id="new-client-sel" style="margin-bottom:4px"></select>
    <div id="new-no-client" style="display:none;font-size:12px;color:#dc2626;margin-top:4px">
      Aucun client. <span style="text-decoration:underline;cursor:pointer" onclick="openClientForm(null);nav('p-client-form')">Créer un client</span>
    </div>
    <label class="lbl">Auditeur *</label>
    <input class="inp" id="new-auditor" placeholder="davy.slila@rentokil-initial.com" style="margin-bottom:20px">
    <button class="btn-r" style="width:100%;padding:14px;font-size:15px" onclick="startInspection()">Démarrer →</button>
  </div>
</div>

<!-- INSPECTION ACTIVE -->
<div id="p-insp-active" class="page">
  <div class="insp-header">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-weight:700;color:#fff;font-size:15px" id="ia-client-name"></div>
        <div style="font-size:11px;color:rgba(255,255,255,0.8);margin-top:1px" id="ia-auditor"></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22px;font-weight:700;color:#fff" id="ia-count">0</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.7)">constats</div>
      </div>
    </div>
    <div class="plans-scroll" id="ia-plans"></div>
  </div>
  <div style="flex:1;overflow:auto;background:#d1d5db;position:relative" id="ia-map-area">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#9ca3af;padding:32px;min-height:280px" id="ia-no-plan">
      <div style="font-size:48px;margin-bottom:12px">🗺️</div>
      <div style="font-size:14px;text-align:center;line-height:1.5">Sélectionnez un plan ci-dessus<br>puis appuyez sur l'emplacement du constat</div>
    </div>
    <div id="map-wrap" style="display:none;position:relative">
      <img id="map-img" src="" alt="Plan" draggable="false" style="display:block;width:100%;user-select:none">
    </div>
  </div>
  <div class="bot-bar">
    <button class="btn-g" onclick="leaveInspection()">← Accueil</button>
    <div style="flex:1"></div>
    <button class="btn-green" id="btn-conclude" style="display:none" onclick="nav('p-conclusion')">Conclure ✓</button>
  </div>
</div>

<!-- CONSTAT FORM -->
<div id="p-constat-form" class="page">
  <div class="bar">
    <button class="back-btn" id="cstat-back">←</button>
    <span class="bar-title" id="cstat-title">Nouveau constat</span>
    <button class="btn-r" style="padding:6px 14px;font-size:13px" onclick="saveConstat()">Valider ✓</button>
  </div>
  <div class="scroll pad" id="cstat-body"></div>
</div>

<!-- CONCLUSION -->
<div id="p-conclusion" class="page">
  <div class="bar">
    <button class="back-btn" onclick="nav('p-insp-active')">←</button>
    <span class="bar-title">Conclusion</span>
  </div>
  <div class="scroll pad">
    <div class="card" id="concl-summary"></div>
    <label class="lbl" style="margin-top:16px">Conclusion générale *</label>
    <textarea class="inp" id="concl-text" rows="9" style="line-height:1.6;margin-bottom:14px"
      placeholder="Synthèse de l'inspection, analyse du risque, plan d'actions prioritaires..."></textarea>
    <button class="btn-g" style="width:100%;margin-bottom:10px" onclick="previewReport()">👁 Prévisualiser le rapport</button>
    <button class="btn-green" style="width:100%;padding:14px;font-size:15px" onclick="finishInspection()">Générer le rapport PDF et terminer →</button>
  </div>
</div>

<!-- MODAL TYPE -->
<div class="overlay" id="modal-type">
  <div class="modal">
    <div style="text-align:center;font-weight:600;margin-bottom:16px;font-size:15px">Type de constat</div>
    <div class="grid4" id="type-grid"></div>
    <button style="width:100%;margin-top:14px;padding:10px;background:none;border:none;color:#6b7280;font-size:14px" onclick="closeModal('modal-type')">Annuler</button>
  </div>
</div>

<!-- MODAL CONSTAT DETAIL -->
<div class="overlay" id="modal-cdetail">
  <div class="modal" id="modal-cdetail-body"></div>
</div>

<script>
/* ═══ DONNÉES ═══════════════════════════════════════════ */
const TYPES={
  Rongeurs:{e:"🐀",c:"#dc2626",subs:["Rats bruns","Rats noirs","Souris","Non identifié"],
    sp:{"Rats bruns":[],"Rats noirs":[],"Souris":[]},
    r:["Postes d'appâtage toxique","Pièges mécaniques","Pièges connectés Radar X","Stations Dual Autogate","Caméra Optix","Colmatage des accès","Conestop","Tir sanitaire","Inspection approfondie"]},
  IPS:{e:"🪲",c:"#7c3aed",subs:["Pyrales","Triboliums","Vrillettes","Charançons","Autre"],
    sp:{Pyrales:["Teigne de la farine","Teigne des greniers"],Triboliums:["Castaneum","Confusum"],Vrillettes:["Du pain","Des meubles"]},
    r:["Pièges à phéromones","Thermobiocide","Deep cleaning","Nettoyage régulier","Aspiration technique"]},
  Insectes:{e:"🐜",c:"#d97706",subs:["Fourmis","Cafards","Mouches","Moustiques","Autre"],
    sp:{Fourmis:["Fourmi noire","Fourmi pharaon","Autre fourmi"],Cafards:["Blatte germanique","Blatte orientale"]},
    r:["Gel appât insecticide","Traitement insecticide","Nettoyage"]},
  Oiseaux:{e:"🐦",c:"#0891b2",subs:["Pigeons","Moineaux","Étourneaux","Autre"],sp:{},
    r:["Gel répulsif","Pics anti-pigeons (Ultra 1/2)","Effarouchement","Prédation biologique","Capture (cage)"]},
  Herméticité:{e:"🚪",c:"#059669",subs:[],sp:{},r:["Bas de porte","Flexi-Armour","Colmatage Multiseal","Conestop","Bernatom"]},
  Entretien:{e:"🧹",c:"#ca8a04",subs:[],sp:{},r:["Entretenir végétation","Nettoyage régulier","Deep cleaning"]},
  Stockage:{e:"📦",c:"#9333ea",subs:[],sp:{},r:["Améliorer stockage","Rotation des stocks","Mise sous film"]},
  Travaux:{e:"🔧",c:"#f59e0b",subs:[],sp:{},r:["Intervention urgente","Signalétique"]}
};
const PRIOS=[
  {l:"A faire le plus rapidement possible",c:"#dc2626",e:"🔴"},
  {l:"A faire rapidement",c:"#ea580c",e:"🟠"},
  {l:"A planifier",c:"#ca8a04",e:"🟡"},
  {l:"Pour information",c:"#16a34a",e:"🟢"}
];

/* ═══ ÉTAT ══════════════════════════════════════════════ */
let S={
  clients:    JSON.parse(localStorage.getItem("clients")||"[]"),
  plans:      JSON.parse(localStorage.getItem("plans")||"{}"),
  inspections:JSON.parse(localStorage.getItem("inspections")||"[]"),
  activeInsp: JSON.parse(localStorage.getItem("activeInsp")||"null"),
  constats:   JSON.parse(localStorage.getItem("constats")||"[]"),
  currentClientId:null, selPlanId:null, pendPt:null,
  editConstatId:null, cstatType:null, fromInsp:false
};
function persist(keys){
  (keys||["clients","plans","inspections","activeInsp","constats"]).forEach(k=>{
    localStorage.setItem(k,JSON.stringify(S[k]));
  });
}

/* ═══ UTILITAIRES ═══════════════════════════════════════ */
const uid=()=>Math.random().toString(36).substr(2,9);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=d=>new Date(d).toLocaleDateString("fr-FR");
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2200);}
function closeModal(id){document.getElementById(id).classList.remove("open");}
function compress(file,maxW){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");
        let w=img.width,h=img.height;
        if(w>maxW){h=h*maxW/w;w=maxW;}
        c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",0.65));
      };
      img.src=e.target.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ═══ NAVIGATION ════════════════════════════════════════ */
function nav(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const p=document.getElementById(pageId);
  if(p){p.classList.add("active");window.scrollTo(0,0);}
  if(pageId==="p-home")        renderHome();
  if(pageId==="p-clients")     renderClients();
  if(pageId==="p-insp-new")    renderInspNew();
  if(pageId==="p-insp-active") renderInspActive();
  if(pageId==="p-conclusion")  renderConclusion();
}

/* ═══ HOME ══════════════════════════════════════════════ */
function renderHome(){
  const ha=document.getElementById("home-active");
  if(S.activeInsp){
    ha.innerHTML=`<div class="card" style="border:2px solid #16a34a;cursor:pointer;margin-bottom:12px" onclick="nav('p-insp-active')">
      <div style="font-size:11px;color:#16a34a;font-weight:700">● EN COURS</div>
      <div style="font-weight:700;font-size:15px;margin-top:2px">${esc(S.activeInsp.clientName)}</div>
      <div style="font-size:12px;color:#6b7280;margin-top:2px">${esc(S.activeInsp.auditor)} · ${S.constats.length} constat(s) · ${fmt(S.activeInsp.date)}</div>
      <div style="font-size:12px;color:#16a34a;margin-top:6px">Reprendre →</div>
    </div>`;
  } else {ha.innerHTML="";}
  const hh=document.getElementById("home-history");
  const done=S.inspections.filter(i=>i.status==="done").sort((a,b)=>b.date.localeCompare(a.date));
  if(done.length===0&&S.clients.length===0&&!S.activeInsp){
    hh.innerHTML=`<div style="text-align:center;color:#9ca3af;padding:32px">
      <div style="font-size:40px;margin-bottom:8px">🏭</div>
      <div style="font-size:14px">Commencez par créer un client</div>
      <button class="btn-r" style="margin-top:14px" onclick="openClientForm(null);nav('p-client-form')">+ Créer un client</button>
    </div>`;return;
  }
  if(done.length===0){hh.innerHTML="";return;}
  hh.innerHTML=`<div style="font-weight:600;font-size:14px;margin-bottom:8px">Inspections terminées</div>`+
    done.map(i=>`<div class="card" style="display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.clientName)}</div>
        <div style="font-size:12px;color:#6b7280">${fmt(i.date)} · ${esc(i.auditor)} · ${i.constatsCount||0} constats</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button class="btn-g" style="padding:6px 10px;font-size:12px" onclick="generateReport(S.inspections.find(x=>x.id==='${i.id}'),S.inspections.find(x=>x.id==='${i.id}').constats||[],S.inspections.find(x=>x.id==='${i.id}').conclusion||'')">PDF</button>
        <button class="btn-r" style="padding:6px 10px;font-size:12px" onclick="reopenInspection('${i.id}')">Modifier</button>
      </div>
    </div>`).join("");
}

function doExport(){
  const data={version:1,exportDate:new Date().toISOString(),clients:S.clients,plans:S.plans,inspections:S.inspections};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`audit_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);
  toast("Export téléchargé ✓");
}
function doImport(input){
  const file=input.files[0];if(!file)return;
  const fr=new FileReader();
  fr.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!confirm(`Importer ? (${d.clients?.length||0} clients, ${d.inspections?.length||0} inspections)\nATTENTION : remplace les données actuelles.`))return;

/* Capture snapshot plan */
function capturePlanSnapshot(plan,x,y,type){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const W=500,H=340,c=document.createElement("canvas");c.width=W;c.height=H;
      const ctx=c.getContext("2d");
      const nW=img.naturalWidth,nH=img.naturalHeight;
      const mx=nW*x/100,my=nH*y/100;
      const cW=nW*0.78,cH=nH*0.78;
      let sx=Math.max(0,Math.min(mx-cW/2,nW-cW));
      let sy=Math.max(0,Math.min(my-cH/2,nH-cH));
      ctx.drawImage(img,sx,sy,cW,cH,0,0,W,H);
      const t=TYPES[type]||{c:"#dc2626"};
      const px=(mx-sx)/cW*W,py=(my-sy)/cH*H;
      ctx.beginPath();ctx.arc(px,py,20,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.4)";ctx.fill();
      ctx.beginPath();ctx.arc(px,py,13,0,Math.PI*2);ctx.fillStyle=t.c;ctx.fill();
      ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
      ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(px-6,py);ctx.lineTo(px+6,py);ctx.stroke();
      ctx.beginPath();ctx.moveTo(px,py-6);ctx.lineTo(px,py+6);ctx.stroke();
      res(c.toDataURL("image/jpeg",0.82));
    };
    img.onerror=()=>res(null);img.src=plan.image;
  });
}

async function saveConstat(){
  const plan=S.selPlanId?(S.plans[S.activeInsp?.clientId]||[]).find(p=>p.id===S.selPlanId):null;
  const existing=S.editConstatId?S.constats.find(c=>c.id===S.editConstatId):null;
  const px=S.pendPt?.x??existing?.x,py=S.pendPt?.y??existing?.y;
  let locationSnap=existing?.locationSnap||null;
  if(plan&&px!=null&&py!=null)locationSnap=await capturePlanSnapshot(plan,px,py,S.cstatType);
  const nc={id:S.editConstatId||uid(),planId:plan?.id,planName:plan?.name||"Zone non définie",
    x:px,y:py,type:S.cstatType,subtype:_subtype,species:_species,priority:_priority,
    observations:document.getElementById("cf-obs").value.trim(),
    recommendations:[..._recos],photos:[..._photos],locationSnap};
  if(S.editConstatId)S.constats=S.constats.map(c=>c.id===S.editConstatId?nc:c);
  else S.constats.push(nc);
  persist(["constats"]);toast("Constat enregistré ✓");nav("p-insp-active");
  updateConstatCount();renderMarkers();
}

/* ═══ RAPPORT PDF — SLIDES PAYSAGE ══════════════════════ */
function generateReport(insp,constats,conclusion){
  const C=Array.isArray(constats)?constats:[];
  const byType=C.reduce((a,c)=>{a[c.type]=(a[c.type]||0)+1;return a},{});
  const byPlan=C.reduce((a,c)=>{const k=c.planName||"Zone non définie";if(!a[k])a[k]=[];a[k].push(c);return a},{});
  const pCol=["#dc2626","#ea580c","#ca8a04","#16a34a"];
  const pDot=["🔴","🟠","🟡","🟢"];
  const pLbl=["A faire le plus rapidement possible","A faire rapidement","A planifier","Pour information"];
  const nSlides=2+Math.ceil(C.length/2)+(C.length>0?1:0)+1;
  let sn=1;

  const footer=(info="")=>`<div style="background:#f5f5f5;border-top:2px solid #c00;padding:2.5mm 12mm;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
    <div style="font-size:7pt;color:#999">Document confidentiel — Usage interne Rentokil · ${fmt(new Date())}</div>
    ${info?`<div style="font-size:7pt;color:#666">${info}</div>`:""}
    <div style="font-size:7pt;color:#c00;font-weight:700">${sn++} / ${nSlides}</div>
  </div>`;

  /* SLIDE 1 — COVER : logo Rentokil géant, zéro souris */
  const slide1=`<div style="width:297mm;height:210mm;display:flex;flex-direction:row;overflow:hidden;background:#fff;page-break-after:always">
    <!-- Gauche rouge -->
    <div style="width:58%;background:#c00;padding:10mm 14mm;display:flex;flex-direction:column;justify-content:center;position:relative">
      <!-- RENTOKIL ultra-grand -->
      <div style="line-height:0.85;margin-bottom:5mm">
        <div style="font-size:70pt;font-weight:900;color:#fff;letter-spacing:-4px;font-family:Arial,sans-serif">RENT</div>
        <div style="font-size:70pt;font-weight:900;color:rgba(255,255,255,0.22);letter-spacing:-4px;font-family:Arial,sans-serif;margin-top:-6px">OKIL</div>
      </div>
      <div style="width:40mm;height:3px;background:rgba(255,255,255,0.3);margin-bottom:5mm;border-radius:2px"></div>
      <div style="font-size:8pt;color:rgba(255,255,255,0.5);letter-spacing:2px;text-transform:uppercase;margin-bottom:9mm;font-family:Arial,sans-serif">
        The world's leading pest control company
      </div>
      <div style="border-top:2px solid rgba(255,255,255,0.25);padding-top:6mm">
        <div style="font-size:18pt;font-weight:700;color:#fff;font-family:Arial,sans-serif">Rapport d'audit nuisibles</div>
        <div style="font-size:13pt;color:rgba(255,255,255,0.85);margin-top:2mm;font-family:Arial,sans-serif">${esc(insp.clientName)}</div>
      </div>
      <div style="margin-top:5mm;display:flex;flex-direction:column;gap:2.5mm">
        <div style="font-size:9pt;color:rgba(255,255,255,0.75);font-family:Arial,sans-serif">
          <span style="background:rgba(255,255,255,0.18);padding:1px 8px;border-radius:3px;color:#fff;font-weight:600;margin-right:6px">Date</span>${fmt(insp.date)}
        </div>
        <div style="font-size:9pt;color:rgba(255,255,255,0.75);font-family:Arial,sans-serif">
          <span style="background:rgba(255,255,255,0.18);padding:1px 8px;border-radius:3px;color:#fff;font-weight:600;margin-right:6px">Auditeur</span>${esc(insp.auditor)}
        </div>
      </div>
      <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.18);padding:2.5mm 14mm;display:flex;justify-content:space-between">
        <span style="font-size:7pt;color:rgba(255,255,255,0.45);font-family:Arial,sans-serif">rentokil-initial.com</span>
        <span style="font-size:7pt;color:rgba(255,255,255,0.45);font-family:Arial,sans-serif">Document confidentiel — Usage interne</span>
      </div>
    </div>
    <!-- Droite blanche -->
    <div style="width:42%;background:#fff;padding:10mm 12mm;display:flex;flex-direction:column;justify-content:center">
      <div style="font-size:26pt;font-weight:900;color:#c00;letter-spacing:-1px;border-bottom:3px solid #c00;padding-bottom:4mm;margin-bottom:5mm;text-align:center;font-family:Arial,sans-serif">
        RENT<span style="color:#ccc">OKIL</span>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:10pt;font-family:Arial,sans-serif;margin-bottom:5mm">
        <tr><td style="padding:5px 10px;border-bottom:1px solid #eee;font-weight:600;color:#c00;width:38%">Client</td><td style="padding:5px 10px;border-bottom:1px solid #eee"><b>${esc(insp.clientName)}</b></td></tr>
        ${insp.clientAddress?`<tr><td style="padding:5px 10px;border-bottom:1px solid #eee;font-weight:600;color:#c00">Adresse</td><td style="padding:5px 10px;border-bottom:1px solid #eee">${esc(insp.clientAddress)}</td></tr>`:""}
        <tr><td style="padding:5px 10px;border-bottom:1px solid #eee;font-weight:600;color:#c00">Date</td><td style="padding:5px 10px;border-bottom:1px solid #eee">${fmt(insp.date)}</td></tr>
        <tr><td style="padding:5px 10px;border-bottom:1px solid #eee;font-weight:600;color:#c00">Auditeur</td><td style="padding:5px 10px;border-bottom:1px solid #eee">${esc(insp.auditor)}</td></tr>
        <tr><td style="padding:5px 10px;font-weight:600;color:#c00">Nb constats</td><td style="padding:5px 10px;font-size:15pt;font-weight:900;color:#c00">${C.length}</td></tr>
      </table>
      <div style="border-top:1px solid #eee;padding-top:4mm">
        <div style="font-size:7pt;color:#bbb;text-transform:uppercase;letter-spacing:1px;margin-bottom:3mm;text-align:center;font-family:Arial,sans-serif">Services Rentokil Initial</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center">
          ${["Dératisation","Désinsectisation","Désinfection","Oiseaux","IPS","Audit"].map(s=>
            `<span style="background:#f5f5f5;border:1px solid #e0e0e0;padding:2px 8px;border-radius:3px;font-size:7.5pt;color:#666;font-family:Arial,sans-serif">${s}</span>`
          ).join("")}
        </div>
      </div>
    </div>
  </div>`;
  sn++;

  /* SLIDE 2 — SYNTHÈSE */
  const slide2=`<div style="width:297mm;height:210mm;display:flex;flex-direction:column;overflow:hidden;background:#fff;page-break-after:always;font-family:Arial,sans-serif">
    <div style="background:#c00;padding:5mm 12mm;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      <div style="font-size:15pt;font-weight:700;color:#fff">Synthèse de l'inspection</div>
      <div style="font-size:14pt;font-weight:900;color:rgba(255,255,255,0.5)">RENT<b style="color:#fff">OKIL</b></div>
    </div>
    <div style="flex:1;padding:7mm 12mm;display:flex;gap:8mm;overflow:hidden">
      <div style="flex:1">
        <div style="font-size:9pt;font-weight:700;color:#333;margin-bottom:4mm;text-transform:uppercase;letter-spacing:0.5px">Par type de nuisible</div>
        ${Object.entries(byType).map(([t,n])=>{const ti=TYPES[t]||{e:"?",c:"#666"};return `
        <div style="display:flex;align-items:center;gap:8px;padding:3mm 4mm;border-radius:6px;background:#f9f9f9;border-left:4px solid ${ti.c};margin-bottom:3mm">
          <div style="font-size:20pt;font-weight:900;color:${ti.c};min-width:32px;text-align:center">${n}</div>
          <div><div style="font-size:10pt;font-weight:600">${ti.e} ${esc(t)}</div>
          <div style="font-size:8pt;color:#888">${n} constat${n>1?"s":""}</div></div>
        </div>`}).join("")}
      </div>
      <div style="flex:1">
        <div style="font-size:9pt;font-weight:700;color:#333;margin-bottom:4mm;text-transform:uppercase;letter-spacing:0.5px">Par priorité</div>
        ${PRIOS.map((p,i)=>{const n=C.filter(c=>c.priority===i).length;return `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3mm;padding:3mm 4mm;border-radius:4px;background:#f9f9f9">
          <div style="width:12px;height:12px;border-radius:50%;background:${p.c};flex-shrink:0"></div>
          <div style="font-size:9pt;flex:1">${p.l}</div>
          <div style="font-size:12pt;font-weight:700;color:${p.c}">${n}</div>
        </div>`}).join("")}
        <div style="margin-top:5mm;font-size:8pt;color:#999;border-top:1px solid #eee;padding-top:4mm">
          ${Object.entries(byPlan).map(([k,v])=>`<div style="margin-bottom:2mm">📍 <b>${esc(k)}</b> — ${v.length} constat${v.length>1?"s":""}</div>`).join("")}
        </div>
      </div>
    </div>
    ${footer("Synthèse")}
  </div>`;

  /* SLIDES CONSTATS — 2 par slide */
  const halfConstat=(c,idx,top)=>{
    const t=TYPES[c.type]||{e:"?",c:"#666"};
    const pr=PRIOS[c.priority]||PRIOS[0];
    const ph=(img,lbl)=>img
      ?`<div style="flex:1;min-width:0;position:relative;overflow:hidden"><img src="${img}" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:2px;left:3px;background:rgba(0,0,0,0.55);color:#fff;font-size:6pt;padding:1px 5px;border-radius:2px">${lbl}</div></div>`
      :`<div style="flex:1;background:#e5e7eb;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:14pt">—</div>`;
    return `<div style="flex:1;display:flex;flex-direction:column;${top?"border-top:2px solid #ddd":""}">
      <div style="background:${t.c};padding:1.5mm 8mm;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:9pt;font-weight:700;color:#fff;font-family:Arial,sans-serif">${t.e} ${esc(c.type)}</span>
          ${c.subtype?`<span style="color:rgba(255,255,255,0.75);font-size:8pt;font-family:Arial,sans-serif">▸ ${esc(c.subtype)}</span>`:""}
          ${c.species?`<span style="color:rgba(255,255,255,0.55);font-size:7.5pt;font-family:Arial,sans-serif">(${esc(c.species)})</span>`:""}
          <span style="color:rgba(255,255,255,0.55);font-size:7.5pt;font-family:Arial,sans-serif">· 📍 ${esc(c.planName||"")}</span>
        </div>
        <span style="background:rgba(0,0,0,0.22);color:#fff;padding:1px 8px;border-radius:10px;font-size:7.5pt;font-weight:600;font-family:Arial,sans-serif">${pr.e} ${esc(pr.l)} · N°${idx+1}</span>
      </div>
      <div style="flex:1;display:flex;overflow:hidden">
        <div style="width:54%;display:flex;gap:1px;background:#ccc;overflow:hidden">
          ${ph(c.locationSnap,"Localisation")}
          ${ph(c.photos?.[0],"Photo 1")}
          ${ph(c.photos?.[1],"Photo 2")}
          ${ph(c.photos?.[2],"Photo 3")}
        </div>
        <div style="width:46%;padding:2.5mm 5mm;display:flex;flex-direction:column;gap:2mm;background:#fff;overflow:hidden;font-family:Arial,sans-serif">
          <div style="background:#f9f9f9;border-radius:4px;padding:2mm 3mm;flex:1;overflow:hidden">
            <div style="font-size:6.5pt;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#999;margin-bottom:1.5mm">Observations</div>
            <div style="font-size:8pt;color:#333;line-height:1.45">${esc(c.observations)||"—"}</div>
          </div>
          <div style="background:#f9f9f9;border-radius:4px;padding:2mm 3mm;flex:1;overflow:hidden">
            <div style="font-size:6.5pt;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#999;margin-bottom:1.5mm">Actions recommandées</div>
            <div>${c.recommendations?.length?c.recommendations.map(r=>`<span style="display:inline-block;background:#fff3cd;border:1px solid #ffc107;border-radius:2px;padding:1px 5px;font-size:7pt;color:#856404;margin:1px">${esc(r)}</span>`).join(""):"—"}</div>
          </div>
        </div>
      </div>
    </div>`;
  };

  const pairs=[];for(let i=0;i<C.length;i+=2)pairs.push(C.slice(i,i+2));
  const slidesConstats=pairs.map((pair,pi)=>{
    const n=sn;sn++;
    return `<div style="width:297mm;height:210mm;display:flex;flex-direction:column;overflow:hidden;background:#fff;page-break-after:always;font-family:Arial,sans-serif">
      <div style="background:#222;padding:3mm 12mm;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
        <div style="font-size:10pt;font-weight:600;color:#fff">${esc(insp.clientName)} — Constats ${C.indexOf(pair[0])+1}${pair[1]?" & "+(C.indexOf(pair[1])+1):""}</div>
        <div style="font-size:11pt;font-weight:900;color:rgba(255,255,255,0.4)">RENT<b style="color:rgba(255,255,255,0.7)">OKIL</b></div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
        ${halfConstat(pair[0],C.indexOf(pair[0]),false)}
        ${pair[1]?halfConstat(pair[1],C.indexOf(pair[1]),true):`<div style="flex:1;background:#f9fafb;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:10pt;border-top:2px solid #eee">— Fin des constats —</div>`}
      </div>
      <div style="background:#f5f5f5;border-top:2px solid #c00;padding:2.5mm 12mm;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
        <div style="font-size:7pt;color:#999;font-family:Arial,sans-serif">Document confidentiel — Usage interne Rentokil · ${fmt(new Date())}</div>
        <div style="font-size:7pt;color:#c00;font-weight:700;font-family:Arial,sans-serif">${n} / ${nSlides}</div>
      </div>
    </div>`;
  }).join("");

  /* SLIDE CONCLUSION */
  const slideConclusion=C.length>0?`<div style="width:297mm;height:210mm;display:flex;flex-direction:column;overflow:hidden;background:#fff;page-break-after:always;font-family:Arial,sans-serif">
    <div style="background:#c00;padding:5mm 12mm;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      <div style="font-size:15pt;font-weight:700;color:#fff">Conclusion générale</div>
      <div style="font-size:14pt;font-weight:900;color:rgba(255,255,255,0.5)">RENT<b style="color:#fff">OKIL</b></div>
    </div>
    <div style="flex:1;display:flex;gap:0;overflow:hidden">
      <div style="width:55%;padding:7mm 10mm;border-right:1px solid #eee;overflow:hidden">
        <div style="font-size:9pt;font-weight:700;color:#c00;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4mm">Analyse et synthèse</div>
        <div style="font-size:9.5pt;line-height:1.7;color:#333;white-space:pre-wrap;overflow:hidden">${esc(conclusion)}</div>
      </div>
      <div style="width:45%;padding:7mm 9mm;background:#f9f9f9;overflow:hidden">
        <div style="font-size:9pt;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4mm">Plan d'actions prioritaires</div>
        <table style="width:100%;border-collapse:collapse;font-size:8pt">
          <tr><th style="background:#c00;color:#fff;padding:4px 6px;text-align:left">Zone</th><th style="background:#c00;color:#fff;padding:4px 6px;text-align:left">Problème</th><th style="background:#c00;color:#fff;padding:4px 6px;text-align:left">Priorité</th></tr>
          ${C.map(c=>`<tr><td style="padding:4px 6px;border-bottom:1px solid #eee">${esc(c.planName)||"—"}</td>
            <td style="padding:4px 6px;border-bottom:1px solid #eee">${esc(c.type)}${c.subtype?" – "+esc(c.subtype):""}</td>
            <td style="padding:4px 6px;border-bottom:1px solid #eee;color:${pCol[c.priority]||pCol[0]};font-weight:600">${pDot[c.priority]||"🔴"}</td></tr>`).join("")}
        </table>
        <div style="display:flex;gap:5mm;margin-top:6mm">
          <div style="flex:1;border-top:1px solid #999;padding-top:2mm;font-size:8pt;color:#999">Auditeur<br><b style="color:#333">${esc(insp.auditor)}</b></div>
          <div style="flex:1;border-top:1px solid #999;padding-top:2mm;font-size:8pt;color:#999">Client<br><b style="color:#333">${esc(insp.clientName)}</b></div>
        </div>
      </div>
    </div>
    ${footer("Conclusion")}
  </div>`:"";

  /* BACK COVER */
  const backCover=`<div style="width:297mm;height:210mm;background:#c00;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif">
    <div style="text-align:center;color:#fff">
      <div style="font-size:58pt;font-weight:900;letter-spacing:-3px;line-height:0.9">
        <span style="color:#fff">RENT</span><span style="color:rgba(255,255,255,0.28)">OKIL</span>
      </div>
      <div style="font-size:10pt;color:rgba(255,255,255,0.6);margin-top:4mm;letter-spacing:2px;text-transform:uppercase">The world's leading pest control company</div>
      <div style="width:50mm;height:2px;background:rgba(255,255,255,0.25);margin:7mm auto;border-radius:2px"></div>
      <div style="font-size:10pt;color:rgba(255,255,255,0.8)">Auditeur : <b style="color:#fff">${esc(insp.auditor)}</b></div>
      <div style="font-size:8pt;color:rgba(255,255,255,0.45);margin-top:4mm">Document non officiel · Usage interne · ${fmt(new Date())}</div>
    </div>
  </div>`;

  const html=`<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rapport audit — ${esc(insp.clientName)}</title>
<style>
@page{size:297mm 210mm landscape;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:Arial,sans-serif}
@media screen{body{padding:8mm}.slide-wrap{margin:0 auto 6mm;box-shadow:0 3px 16px rgba(0,0,0,0.4)}}
@media print{body{background:white;padding:0}}
</style></head><body>
<button onclick="window.print()" class="noprint"
  style="position:fixed;bottom:16px;right:16px;background:#c00;color:#fff;border:none;
  padding:12px 22px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;
  box-shadow:0 2px 12px rgba(0,0,0,.4);z-index:999;font-family:Arial,sans-serif">
  🖨️ Imprimer / PDF
</button>
<style>@media print{.noprint{display:none!important}}</style>
${slide1}${slide2}${slidesConstats}${slideConclusion}${backCover}
</body></html>`;

  const w=window.open("","_blank");
  if(w){w.document.write(html);w.document.close();}
  else alert("Autorisez les popups pour générer le rapport.");
}

const manifest={name:"Audit Nuisibles Rentokil",short_name:"Inspection",start_url:"./",
  display:"standalone",background_color:"#ffffff",theme_color:"#dc2626",
  icons:[{src:"data:image/svg+xml,"+encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#dc2626"/><text y="55" x="50" text-anchor="middle" font-size="28" font-weight="900" font-family="Arial" fill="white">RENT</text><text y="80" x="50" text-anchor="middle" font-size="28" font-weight="900" font-family="Arial" fill="rgba(255,255,255,0.4)">OKIL</text></svg>'),
    sizes:"512x512",type:"image/svg+xml",purpose:"any maskable"}]};

nav("p-home");
