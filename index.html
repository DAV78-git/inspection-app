<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Inspection">
  <meta name="theme-color" content="#e8291c">
  
  <title>Audit Nuisibles — Rentokil</title>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f3f4f6;
      color: #111;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    
    input, textarea, select, button {
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    
    button { cursor: pointer; }
    textarea { resize: vertical; }
    img { display: block; max-width: 100%; }
    
    /* Structure des pages */
    .page { display: none; min-height: 100dvh; flex-direction: column; }
    .page.active { display: flex; }
    .scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
    .pad { padding: 16px; }
    
    /* Composants UI */
    .bar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 40;
      flex-shrink: 0;
    }
    
    .bar-title { flex: 1; font-weight: 600; font-size: 16px; }
    
    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: #6b7280;
      padding: 0 4px;
      min-width: 32px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .btn-r { background: #e8291c; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 14px; }
    .btn-g { background: #fff; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 16px; font-size: 14px; color: #374151; }
    .btn-green { background: #16a34a; color: #fff; border: none; border-radius: 10px; padding: 10px 16px; font-weight: 600; font-size: 14px; }
    
    .inp { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #fff; color: #111; margin-top: 4px; }
    .lbl { font-size: 13px; font-weight: 500; color: #374151; display: block; margin-bottom: 2px; margin-top: 12px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; }
    .chip { padding: 6px 12px; border-radius: 20px; border: 1px solid #d1d5db; background: #f9fafb; color: #374151; font-size: 13px; cursor: pointer; display: inline-block; margin: 3px; }
    
    /* Overlays & Modals */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100; align-items: flex-end; }
    .overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 18px 18px 0 0; width: 100%; padding: 20px; max-height: 85dvh; overflow-y: auto; }
    
    /* Cartographie */
    .marker { position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: bold; cursor: pointer; transform: translate(-50%,-50%); z-index: 10; }
    
    /* Grids */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    
    /* Photos & Formulaires */
    .photo-slot { aspect-ratio: 1; border: 2px dashed #d1d5db; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; background: #f9fafb; font-size: 24px; color: #9ca3af; }
    .photo-slot img { width: 100%; height: 100%; object-fit: cover; }
    .reco-row { padding: 9px 12px; border-radius: 8px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 13px; display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 6px; text-align: left; width: 100%; color: #111; }
    .reco-row.on { background: #f0fdf4; border-color:#16a34a; }
    .prio-row { padding: 9px 12px; border-radius: 8px; border: 1px solid #e5e7eb; background: #f9fafb; font-size: 13px; cursor: pointer; margin-bottom: 6px; text-align: left; width: 100%; color: #111; }
    
    /* En-têtes spécifiques */
    .cover-bar { background: #e8291c; padding: 24px 16px 32px; }
    .cover-title { font-size: 22px; font-weight: 700; color: #fff; }
    .cover-sub { font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 4px; }
    .insp-header { background: #e8291c; padding: 12px 16px; flex-shrink: 0; }
    .plans-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; margin-top: 10px; }
    .plan-tab { flex-shrink: 0; font-size: 11px; padding: 4px 10px; border-radius: 20px; cursor: pointer; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: rgba(255,255,255,0.9); white-space: nowrap; }
    .plan-tab.sel { background: #fff; color: #e8291c; border-color: #fff; }
    .bot-bar { background: #fff; border-top: 1px solid #e5e7eb; padding: 10px 16px; display: flex; gap: 10px; flex-shrink: 0; }
    .tag { display: inline-flex; align-items: center; gap: 4px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 20px; padding: 4px 10px; font-size: 13px; margin: 3px; }
    
    #toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 200; display: none; white-space: nowrap; }
  </style>
</head>
<body>

<div id="toast" role="alert" aria-live="assertive"></div>

<main id="p-home" class="page">
  <div class="cover-bar">
    <div class="cover-sub">Rentokil · Audit terrain</div>
    <h1 class="cover-title">Inspections</h1>
  </div>
  <div class="scroll pad" style="margin-top:-16px">
    <div id="home-active"></div>
    <div class="grid2" style="margin-bottom:10px">
      <button type="button" class="btn-r" style="border-radius:12px;padding:14px 8px;width:100%" onclick="nav('p-insp-new')">+ Inspection</button>
      <button type="button" class="btn-g" style="border-radius:12px;padding:14px 8px;width:100%" onclick="nav('p-clients')">👥 Clients</button>
    </div>
    <div class="grid2" style="margin-bottom:20px">
      <button type="button" class="btn-g" style="width:100%;padding:9px 8px;font-size:13px" onclick="doExport()">💾 Exporter</button>
      <button type="button" class="btn-g" style="width:100%;padding:9px 8px;font-size:13px" onclick="document.getElementById('imp-file').click()">📂 Importer</button>
    </div>
    <input id="imp-file" type="file" accept=".json" style="display:none" onchange="doImport(this)">
    <div id="home-history"></div>
  </div>
</main>

<section id="p-clients" class="page">
  <div class="bar">
    <button type="button" class="back-btn" onclick="nav('p-home')" aria-label="Retour">←</button>
    <span class="bar-title">Clients</span>
    <button type="button" class="btn-r" style="padding:6px 12px;font-size:13px" onclick="openClientForm(null)">+ Ajouter</button>
  </div>
  <div class="scroll pad" id="clients-list"></div>
</section>

<section id="p-client-form" class="page">
  <div class="bar">
    <button type="button" class="back-btn" onclick="nav('p-clients')" aria-label="Retour">←</button>
    <span class="bar-title" id="cform-title">Nouveau client</span>
    <button type="button" class="btn-r" style="padding:6px 12px;font-size:13px" onclick="saveClient()">Sauvegarder</button>
  </div>
  <div class="scroll pad">
    <input type="hidden" id="cform-id">
    <label class="lbl" for="cform-name">Nom *</label>
    <input class="inp" id="cform-name" placeholder="Ex: Panzani Marseille">
    
    <label class="lbl" for="cform-address">Adresse</label>
    <input class="inp" id="cform-address" placeholder="131 Av. Corot, 13013 Marseille">
    
    <label class="lbl" for="cform-contact">Contact</label>
    <input class="inp" id="cform-contact" placeholder="Nom du responsable">
  </div>
</section>

<section id="p-client-detail" class="page">
  <div class="bar">
    <button type="button" class="back-btn" onclick="nav('p-clients')" aria-label="Retour">←</button>
    <span class="bar-title" id="cdetail-title"></span>
    <button type="button" class="btn-r" style="padding:6px 12px;font-size:13px" onclick="openPlanForm()">+ Plan</button>
  </div>
  <div class="scroll pad">
    <div id="cdetail-info"></div>
    <div style="font-weight:600;margin-bottom:10px">Plans</div>
    <div id="cdetail-plans"></div>
  </div>
</section>

<section id="p-plan-form" class="page">
  <div class="bar">
    <button type="button" class="back-btn" id="plan-back-btn" onclick="nav('p-client-detail')" aria-label="Retour">←</button>
    <span class="bar-title">Ajouter un plan</span>
    <button type="button" class="btn-r" style="padding:6px 12px;font-size:13px" onclick="savePlan()">Sauvegarder</button>
  </div>
  <div class="scroll pad">
    <label class="lbl" for="pform-name">Nom du plan *</label>
    <input class="inp" id="pform-name" placeholder="Extérieur, RDC, Bât. trituration 3ème...">
    
    <label class="lbl" for="pform-building">Bâtiment</label>
    <input class="inp" id="pform-building" placeholder="Bâtiment trituration">
    
    <label class="lbl" for="pform-floor">Niveau / Étage</label>
    <input class="inp" id="pform-floor" placeholder="RDC, 3ème étage...">
    
    <label class="lbl">Image du plan *</label>
    <input type="file" id="pform-file" accept="image/*" style="display:none" onchange="onPlanFile(this)">
    <div id="pform-preview" onclick="document.getElementById('pform-file').click()" style="border:2px dashed #d1d5db;border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:130px;background:#f9fafb;margin-top:4px;font-size:13px;color:#9ca3af;">
      <div style="font-size:32px">📷</div>
      <div style="margin-top:6px">Photographier ou choisir un plan</div>
    </div>
    <input type="hidden" id="pform-image">
  </div>
</section>

<section id="p-insp-new" class="page">
  <div class="bar">
    <button type="button" class="back-btn" onclick="nav('p-home')" aria-label="Retour">←</button>
    <span class="bar-title">Nouvelle inspection</span>
  </div>
  <div class="scroll pad">
    <label class="lbl" for="new-client-sel">Client *</label>
    <select class="inp" id="new-client-sel" style="margin-bottom:4px"></select>
    <div id="new-no-client" style="display:none;font-size:12px;color:#e8291c;margin-top:4px">
      Aucun client. <span style="text-decoration:underline;cursor:pointer" onclick="openClientForm(null);nav('p-client-form')">Créer un client</span>
    </div>
    
    <label class="lbl" for="new-auditor">Auditeur *</label>
    <input class="inp" id="new-auditor" placeholder="davy.slila@rentokil-initial.com" style="margin-bottom:20px">
    
    <button type="button" class="btn-r" style="width:100%;padding:14px;font-size:15px" onclick="startInspection()">Démarrer →</button>
  </div>
</section>

<section id="p-insp-active" class="page">
  <div class="insp-header">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-weight:700;color:#fff;font-size:15px" id="ia-client-name"></div>
        <div style="font-size:11px;color:rgba(255,255,255,0.8);margin-top:1px" id="ia-auditor"></div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22px;font-weight:700;color:#fff" id="ia-count">0</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.7)">constats</div>
      </div>
    </div>
    <div class="plans-scroll" id="ia-plans"></div>
  </div>
  <div style="flex:1;overflow:auto;background:#d1d5db" id="ia-map-area">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#9ca3af;padding:32px;min-height:280px" id="ia-no-plan">
      <div style="font-size:48px;margin-bottom:12px">🗺️</div>
      <div style="font-size:14px;text-align:center;line-height:1.5">Sélectionnez un plan ci-dessus<br>puis appuyez sur l'emplacement du constat</div>
    </div>
    <div id="map-wrap" style="display:none;position:relative">
      <img id="map-img" src="" alt="Plan" draggable="false" style="display:block;width:100%;user-select:none">
    </div>
  </div>
  <div class="bot-bar">
    <button type="button" class="btn-g" onclick="leaveInspection()">← Accueil</button>
    <button type="button" class="btn-g" style="color:#e8291c;border-color:#e8291c;font-size:13px" onclick="deleteActiveInsp()">🗑 Supprimer</button>
    <div style="flex:1"></div>
    <button type="button" class="btn-green" id="btn-conclude" style="display:none" onclick="nav('p-conclusion')">Conclure ✓</button>
  </div>
</section>

<section id="p-constat-form" class="page">
  <div class="bar">
    <button type="button" class="back-btn" id="cstat-back" aria-label="Retour">←</button>
    <span class="bar-title" id="cstat-title">Nouveau constat</span>
    <button type="button" class="btn-r" style="padding:6px 14px;font-size:13px" onclick="saveConstat()">Valider ✓</button>
  </div>
  <div class="scroll pad" id="cstat-body"></div>
</section>

<section id="p-conclusion" class="page">
  <div class="bar">
    <button type="button" class="back-btn" onclick="nav('p-insp-active')" aria-label="Retour">←</button>
    <span class="bar-title">Conclusion</span>
  </div>
  <div class="scroll pad">
    <div class="card" id="concl-summary"></div>
    <label class="lbl" for="concl-text">Conclusion générale *</label>
    <textarea class="inp" id="concl-text" rows="9" style="line-height:1.6;margin-bottom:14px" placeholder="Synthèse de l'inspection, analyse du risque, plan d'actions prioritaires..."></textarea>
    <button type="button" class="btn-g" style="width:100%;margin-bottom:10px" onclick="previewReport()">👁 Prévisualiser</button>
    <button type="button" class="btn-green" style="width:100%;padding:14px;font-size:15px" onclick="finishInspection()">Générer le rapport PDF et terminer →</button>
  </div>
</section>

<div class="overlay" id="modal-type" role="dialog" aria-modal="true">
  <div class="modal">
    <div style="text-align:center;font-weight:600;margin-bottom:16px;font-size:15px">Type de constat</div>
    <div class="grid4" id="type-grid"></div>
    <button type="button" style="width:100%;margin-top:14px;padding:10px;background:none;border:none;color:#6b7280;font-size:14px" onclick="closeModal('modal-type')">Annuler</button>
  </div>
</div>

<div class="overlay" id="modal-cdetail" role="dialog" aria-modal="true">
  <div class="modal" id="modal-cdetail-body"></div>
</div>

<script>
const TYPES={
  Rongeurs:{e:"🐀",c:"#dc2626",subs:["Rats bruns","Rats noirs","Souris","Non identifié"],
    sp:{"Rats bruns":[],"Rats noirs":[],"Souris":[]},
    r:["Postes d'appâtage toxique","Pièges mécaniques","Pièges connectés Radar X","Stations Dual Autogate","Caméra Optix","Colmatage des accès","Conestop","Tir sanitaire","Inspection approfondie"]},
  IPS:{e:"🪲",c:"#7c3aed",subs:["Pyrales","Triboliums","Silvains","Vrillettes","Charançons","Autre"],
    sp:{Pyrales:["Teigne de la farine","Teigne des fruits secs"],Triboliums:["Castaneum","Confusum"],Vrillettes:["Du pain","Du tabac"]},
    r:["Pièges à phéromones","Thermobiocide","Deep cleaning","Nettoyage régulier","Aspiration technique"]},
  Insectes:{e:"🐜",c:"#d97706",subs:["Fourmis","Blattes","Mouches","Moustiques","Autre"],
    sp:{Fourmis:["Fourmi noire","Fourmi pharaon","Autre fourmi"],Blattes:["Blatte germanique","Blatte américaine","Blatte orientale","Blatte rayée"]},
    r:["Gel appât insecticide","Traitement insecticide","Nettoyage"]},
  Oiseaux:{e:"🐦",c:"#0891b2",subs:["Pigeons","Moineaux","Étourneaux","Autre"],sp:{},
    r:["Gel répulsif","Pics anti-pigeons (Ultra 1/2)","Effarouchement","Prédation biologique","Capture (cage)"]},
  Herméticité:{e:"🚪",c:"#059669",subs:[],sp:{},r:["Bas de porte","Flexi-Armour","Colmatage Multiseal","Conestop","Bernatom"]},
  Entretien:{e:"🧹",c:"#ca8a04",subs:[],sp:{},r:["Entretenir végétation","Nettoyage régulier","Deep cleaning"]},
  Stockage:{e:"📦",c:"#9333ea",subs:[],sp:{},r:["Améliorer stockage","Rotation des stocks","Mise sous film"]},
  Travaux:{e:"🔧",c:"#f59e0b",subs:[],sp:{},r:["Intervention urgente","Signalétique"]}
};
const PRIOS=[
  {l:"A faire le plus rapidement possible",c:"#dc2626",e:"🔴"},
  {l:"A faire rapidement",c:"#ea580c",e:"🟠"},
  {l:"A planifier",c:"#ca8a04",e:"🟡"},
  {l:"Pour information",c:"#16a34a",e:"🟢"}
];

let S={
  clients:JSON.parse(localStorage.getItem("clients")||"[]"),
  plans:JSON.parse(localStorage.getItem("plans")||"{}"),
  inspections:JSON.parse(localStorage.getItem("inspections")||"[]"),
  activeInsp:JSON.parse(localStorage.getItem("activeInsp")||"null"),
  constats:JSON.parse(localStorage.getItem("constats")||"[]"),
  currentClientId:null,selPlanId:null,pendPt:null,
  editConstatId:null,cstatType:null,fromInsp:false
};

function persist(keys){
  (keys||["clients","plans","inspections","activeInsp","constats"]).forEach(k=>{
    localStorage.setItem(k,JSON.stringify(S[k]));
  });
}

const uid=()=>Math.random().toString(36).substr(2,9);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=d=>new Date(d).toLocaleDateString("fr-FR");

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.style.display="block";
  setTimeout(()=>t.style.display="none",2200);
}
function closeModal(id){document.getElementById(id).classList.remove("open");}

const compress=(file,maxW)=>new Promise(res=>{
  const fr=new FileReader();
  fr.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");
      let w=img.width,h=img.height;
      if(w>maxW){h=h*maxW/w;w=maxW;}
      c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.92));
    };
    img.src=e.target.result;
  };
  fr.readAsDataURL(file);
});

function nav(pageId){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  const p=document.getElementById(pageId);
  if(p){p.classList.add("active");window.scrollTo(0,0);}
  if(pageId==="p-home")       renderHome();
  if(pageId==="p-clients")      renderClients();
  if(pageId==="p-insp-new")    renderInspNew();
  if(pageId==="p-insp-active") renderInspActive();
  if(pageId==="p-conclusion")  renderConclusion();
}

/* ACCUEIL */
function renderHome(){
  const ha=document.getElementById("home-active");
  if(S.activeInsp){
    ha.innerHTML=`<div class="card" style="border:2px solid #16a34a;cursor:pointer;margin-bottom:12px" onclick="nav('p-insp-active')">
      <div style="font-size:11px;color:#16a34a;font-weight:700">● EN COURS</div>
      <div style="font-weight:700;font-size:15px;margin-top:2px">${esc(S.activeInsp.clientName)}</div>
      <div style="font-size:12px;color:#6b7280;margin-top:2px">${esc(S.activeInsp.auditor)} · ${S.constats.length} constat(s) · ${fmt(S.activeInsp.date)}</div>
      <div style="font-size:12px;color:#16a34a;margin-top:6px">Reprendre →</div>
    </div>`;
  } else {ha.innerHTML="";}
  const hh=document.getElementById("home-history");
  const done=S.inspections.filter(i=>i.status==="done").sort((a,b)=>b.date.localeCompare(a.date));
  if(done.length===0&&S.clients.length===0&&!S.activeInsp){
    hh.innerHTML=`<div style="text-align:center;color:#9ca3af;padding:32px">
      <div style="font-size:40px;margin-bottom:8px">🏭</div>
      <div style="font-size:14px">Commencez par créer un client</div>
      <button type="button" class="btn-r" style="margin-top:14px" onclick="openClientForm(null);nav('p-client-form')">+ Créer un client</button>
    </div>`;return;
  }
  if(done.length===0){hh.innerHTML="";return;}
  hh.innerHTML=`<div style="font-weight:600;font-size:14px;margin-bottom:8px">Inspections terminées</div>`+
    done.map(i=>`<div class="card" style="display:flex;align-items:center;gap:10px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.clientName)}</div>
        <div style="font-size:12px;color:#6b7280">${fmt(i.date)} · ${esc(i.auditor)} · ${i.constatsCount||0} constats</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button type="button" class="btn-g" style="padding:6px 10px;font-size:12px" onclick="window.generateReportTarget('${i.id}')">PDF</button>
        <button type="button" class="btn-r" style="padding:6px 10px;font-size:12px" onclick="reopenInspection('${i.id}')">Modifier</button>
      </div>
    </div>`).join("");
}

function doExport(){

  a.download=`audit_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);

function doImport(input){
  const file=input.files[0];if(!file)return;
  const fr=new FileReader();
  fr.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!confirm(`Importer ? (${d.clients?.length||0} clients, ${d.inspections?.length||0} inspections)\nATTENTION : remplace les données actuelles.`))return;
      if(d.clients)S.clients=d.clients;if(d.plans)S.plans=d.plans;if(d.inspections)S.inspections=d.inspections;
      persist();renderHome();toast("Import réussi ✓");
    }catch(err){alert("Fichier invalide");}
  };
  fr.readAsText(file);input.value="";
}

function capturePlanSnapshot(plan,x,y,type){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const W=600,H=420,c=document.createElement("canvas");c.width=W;c.height=H;
      const ctx=c.getContext("2d");
      const nW=img.naturalWidth,nH=img.naturalHeight;
      const mx=nW*x/100,my=nH*y/100;
      const cW=nW*0.78,cH=nH*0.78;
      let sx=Math.max(0,Math.min(mx-cW/2,nW-cW));
      let sy=Math.max(0,Math.min(my-cH/2,nH-cH));
      ctx.drawImage(img,sx,sy,cW,cH,0,0,W,H);
      const t=TYPES[type]||{c:"#e8291c"};
      const px=(mx-sx)/cW*W,py=(my-sy)/cH*H;
      ctx.beginPath();ctx.arc(px,py,22,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.4)";ctx.fill();
      ctx.beginPath();ctx.arc(px,py,14,0,Math.PI*2);ctx.fillStyle=t.c;ctx.fill();
      ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();
      ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(px-7,py);ctx.lineTo(px+7,py);ctx.stroke();
      ctx.beginPath();ctx.moveTo(px,py-7);ctx.lineTo(px,py+7);ctx.stroke();
      res(c.toDataURL("image/jpeg",0.92));
    };
    img.onerror=()=>res(null);img.src=plan.image;
  });
}

async function saveConstat(){
  const plan=S.selPlanId?(S.plans[S.activeInsp?.clientId]||[]).find(p=>p.id===S.selPlanId):null;
  const existing=S.editConstatId?S.constats.find(c=>c.id===S.editConstatId):null;
  const px=S.pendPt?.x??existing?.x,py=S.pendPt?.y??existing?.y;
  let locationSnap=existing?.locationSnap||null;
  if(plan&&px!=null&&py!=null) locationSnap=await capturePlanSnapshot(plan,px,py,S.cstatType);
  const nc={id:S.editConstatId||uid(),planId:plan?.id,planName:plan?.name||"Zone non définie",
    x:px,y:py,type:S.cstatType,subtype:_subtype,species:_species,priority:_priority,
    observations:document.getElementById("cf-obs").value.trim(),
    recommendations:[..._recos],photos:[..._photos],locationSnap};
  if(S.editConstatId)S.constats=S.constats.map(c=>c.id===S.editConstatId?nc:c);
  else S.constats.push(nc);
  persist(["constats"]);toast("Constat enregistré ✓");nav("p-insp-active");
  updateConstatCount();renderMarkers();
}

  document.getElementById("concl-summary").innerHTML=`<div style="font-weight:600;margin-bottom:10px">${S.constats.length} constat(s)</div>
    <div style="display:flex;flex-wrap:wrap">${Object.entries(byType).map(([t,n])=>`
      <div class="tag"><span>${TYPES[t]?.e||""}</span><span style="color:${TYPES[t]?.c};font-weight:600">${t}</span><span style="color:#6b7280">×${n}</span></div>`).join("")}</div>`;
  document.getElementById("concl-text").value=S.activeInsp?.conclusion||"";
}
function previewReport(){generateReport(S.activeInsp,S.constats,document.getElementById("concl-text").value.trim());}
function finishInspection(){
  const c=document.getElementById("concl-text").value.trim();
  if(!c)return alert("Veuillez saisir une conclusion");
  const done={...S.activeInsp,status:"done",conclusion:c,constats:[...S.constats],constatsCount:S.constats.length};
  S.inspections=S.inspections.map(i=>i.id===S.activeInsp.id?done:i);
  generateReport(done,S.constats,c);
  S.activeInsp=null;S.constats=[];persist();toast("Inspection terminée ✓");nav("p-home");
}

/* GENERATION RAPPORT PDF */
function generateReport(insp,constats,conclusion){
  const C=Array.isArray(constats)?constats:[];
  const byType=C.reduce((a,c)=>{a[c.type]=(a[c.type]||0)+1;return a},{});
  const RED="#e8291c", NAVY="#1a2535";

  const s1=`
  <div style="width:297mm;height:210mm;display:flex;page-break-after:always;overflow:hidden;font-family:Arial,sans-serif">

        <div style="font-size:8pt;color:rgba(255,255,255,0.65);letter-spacing:2px;text-transform:uppercase;margin-bottom:9mm">The Experts in Pest Control</div>

        <div style="font-size:13pt;color:rgba(255,255,255,0.9);margin-bottom:8mm">${esc(insp.clientName)}</div>
        <div style="font-size:9pt;color:rgba(255,255,255,0.6);margin-bottom:2mm">Date d'édition</div>

  const s2=`

        ${Object.entries(byType).map(([t,n])=>{const ti=TYPES[t]||{e:"?",c:"#666"};return `
        <div style="display:flex;align-items:center;gap:10px;padding:3mm 4mm;border-radius:6px;background:#f6f7f9;border-left:4px solid ${ti.c};margin-bottom:3mm">

  const sC=C.map((c,idx)=>{
    const t=TYPES[c.type]||{e:"?",c:"#666"};

      :`<div style="flex:1;background:#dde1e7;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#aaa;gap:4px">

    return `
    <div style="width:297mm;height:210mm;display:flex;flex-direction:column;page-break-after:always;overflow:hidden;background:#fff;font-family:Arial,sans-serif">
      <div style="background:${NAVY};padding:3.5mm 10mm;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">

          <span style="background:${t.c};color:#fff;padding:2px 10px;border-radius:4px;font-size:9pt;font-weight:700;white-space:nowrap;flex-shrink:0">N°${idx+1} — ${t.e} ${esc(c.type)}</span>
          ${c.subtype?`<span style="color:rgba(255,255,255,0.7);font-size:8.5pt;white-space:nowrap;flex-shrink:0">▸ ${esc(c.subtype)}</span>`:""}
          ${c.species?`<span style="color:rgba(255,255,255,0.45);font-size:8pt">(${esc(c.species)})</span>`:""}
          <span style="color:rgba(255,255,255,0.4);font-size:8pt;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📍 ${esc(c.planName||"")}</span>

        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
          <span style="background:${pCol[c.priority]||pCol[0]};color:#fff;padding:2px 10px;border-radius:10px;font-size:8pt;font-weight:600;white-space:nowrap">${pr.e} ${esc(pr.l)}</span>

        <div style="flex:1;padding:4mm 7mm;border-right:1px solid #eee;overflow:hidden">

  }).join("");

  const sConcl=C.length>0?`
  <div style="width:297mm;height:210mm;display:flex;flex-direction:column;page-break-after:always;overflow:hidden;background:#fff;font-family:Arial,sans-serif">
    <div style="background:${NAVY};padding:5mm 10mm;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <span style="font-size:14pt;font-weight:700;color:#fff">Commentaires — Remarques</span>

        <div style="font-size:8pt;font-weight:700;color:#333;text-transform:uppercase;letter-spacing:1px;margin-bottom:4mm">Plan d'actions prioritaires</div>

          ${C.map((c,i)=>`<tr style="background:${i%2?"#fff":"#f0f2f5"}">

  <div style="width:297mm;height:210mm;display:flex;overflow:hidden;font-family:Arial,sans-serif">

      <div style="font-size:9pt;color:#666;text-align:center">The Experts in Pest Control</div>
    </div>
  </div>`;

  const html=`<!DOCTYPE html><html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rapport audit — ${esc(insp.clientName)}</title>
<style>
@page{size:297mm 210mm landscape;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:Arial,sans-serif}
@media screen{body{padding:6mm}}
@media print{body{background:#fff;padding:0}button{display:none!important}}
</style></head><body>
<button onclick="window.print()" style="position:fixed;bottom:16px;right:16px;background:#e8291c;color:#fff;border:none;padding:12px 22px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;box-shadow:0 2px 12px rgba(0,0,0,.4);z-index:999">🖨️ Imprimer / PDF</button>
${s1}${s2}${sC}${sConcl}${sBck}
</body></html>`;

  const w=window.open("","_blank");
  if(w){w.document.write(html);w.document.close();}
  else alert("Autorisez les popups pour générer le rapport.");
}

// Handler global sécurisé pour le bouton de l'historique d'accueil (évite les conflits d'échappement de chaînes)
window.generateReportTarget = function(id) {
  const i = S.inspections.find(x => x.id === id);
  if (i) generateReport(i, i.constats || [], i.conclusion || "");
};
